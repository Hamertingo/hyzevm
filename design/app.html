<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyzeVM — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 13px/1.4 var(--sys); -webkit-font-smoothing: antialiased; background: #000; color: #ededed; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
svg { display: block; flex: none; }
.mono { font-family: var(--mono); }

/* ------------------------------------------------------------ página de revisão */
.page { height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.pagebar { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #1a1a1a; background: #0a0a0a; overflow-x: auto; }
.pagebar .brand { font-weight: 600; white-space: nowrap; } .pagebar .brand span { color: #8f8f8f; font-weight: 400; }
.states { display: flex; gap: 2px; }
.states button { height: 26px; padding: 0 10px; border-radius: 6px; color: #a1a1a1; white-space: nowrap; cursor: pointer; }
.states button:hover { color: #ededed; background: #1a1a1a; }
.states button.on { background: #ededed; color: #0a0a0a; font-weight: 500; }
.pagebar .grow { flex: 1; }
.themebtn { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #2e2e2e; color: #ededed; white-space: nowrap; cursor: pointer; }
.stagewrap { position: relative; overflow: hidden; background: #050505; }
.scaler { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform: translate(-50%, -50%); }

/* ------------------------------------------------------------ janela */
.win { position: relative; width: 1280px; height: 800px; border-radius: 11px; overflow: hidden; display: flex; flex-direction: column;
  --bg: #0d0d0d; --well: #000; --raise: #1a1a1a; --fg: #ededed; --fg-2: #9a9a9a; --fg-3: #5f5f5f;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14); --hover: rgba(255,255,255,.06);
  --accent: #0a84ff; --amber: #ffb224; --green: #3fb950;
  --pal: rgba(28,28,28,.92); --palline: rgba(255,255,255,.08);
  background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px #000, 0 0 0 1.5px rgba(255,255,255,.09), 0 30px 90px rgba(0,0,0,.75); }
.win.light {
  --bg: #fafafa; --well: #ececec; --raise: #ffffff; --fg: #1d1d1f; --fg-2: #737378; --fg-3: #ababaf;
  --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14); --hover: rgba(0,0,0,.045);
  --accent: #007aff; --amber: #c27c0e; --green: #28a745;
  --pal: rgba(250,250,250,.94); --palline: rgba(0,0,0,.07);
  box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 30px 90px rgba(0,0,0,.55); }
.lights { position: absolute; top: 16px; left: 18px; display: flex; gap: 8px; z-index: 60; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

/* ------------------------------------------------------------ peças */
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; background: var(--fg-3); }
.dot.running { background: var(--green); } .dot.wait { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; } .dot.you { background: var(--accent); }
@keyframes pulse { 50% { opacity: .3; } }
.kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; font: 500 11px var(--sys); color: var(--fg-2); background: var(--hover); }
.ib { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--fg-2); }
.ib:hover { background: var(--hover); color: var(--fg); }
.pill { height: 26px; padding: 0 11px; border-radius: 13px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pill.solid { background: var(--fg); color: var(--bg); }
.pill.blue { background: var(--accent); color: #fff; }
.pill.soft { background: var(--hover); color: var(--fg); }
.sw { width: 26px; height: 16px; border-radius: 8px; background: var(--line-2); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on { background: var(--fg); } .sw.on::after { transform: translateX(10px); background: var(--bg); }

/* topo (quase nada) */
.top { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 84px; position: relative; }
.top .grow { flex: 1; }
.find { position: absolute; left: 50%; transform: translateX(-50%); width: 280px; height: 26px; border-radius: 7px; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 10px; color: var(--fg-3); background: var(--hover); font-size: 12.5px; }
.find span { flex: 1; text-align: left; }
.back { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 4px; border-radius: 7px; color: var(--fg-2); }
.back:hover { background: var(--hover); color: var(--fg); }
.crumbname { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.crumbname small { color: var(--fg-3); font-weight: 400; font-size: 12.5px; }

/* ------------------------------------------------------------ grade */
.gridwrap { flex: 1; min-height: 0; overflow: auto; padding: 14px 28px 28px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 22px; max-width: 1040px; margin: 0 auto; }
.tile { text-align: left; display: block; cursor: default; outline: 0; }
.tile .scr { position: relative; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: var(--well); box-shadow: 0 0 0 1px var(--line); transition: box-shadow .15s; }
.tile:hover .scr { box-shadow: 0 0 0 1px var(--line-2); }
.tile.wait .scr { box-shadow: 0 0 0 1.5px var(--amber); }
.tile .meta { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; padding: 0 2px; }
.tile .meta b { font-weight: 500; }
.tile .meta span { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .meta .dot { align-self: center; }
.tile.wait .meta span { color: var(--amber); }
.tile .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; z-index: 3; }
.tile:hover .acts, .tile.hover .acts { opacity: 1; }
.tile .acts button { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.flag { position: absolute; left: 8px; top: 8px; z-index: 3; height: 22px; padding: 0 9px; border-radius: 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; background: var(--amber); color: #1a1100; }
.tile.paused .scr::after { content: "Pausada"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); font-size: 12px; font-weight: 500; z-index: 2; }
.tile.new .scr { display: grid; place-items: center; background: transparent; box-shadow: none; outline: 1px dashed var(--line-2); outline-offset: -1px; color: var(--fg-3); }
.tile.new .scr div { text-align: center; } .tile.new .scr small { display: block; margin-top: 6px; font-size: 12px; }
.tile.creating .scr { display: grid; place-items: center; color: var(--fg-2); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-2); border-top-color: var(--fg); animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ foco */
.focus { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; padding: 0 16px 16px; }
.focus .scr { position: relative; width: min(100cqw - 32px, (100cqh - 16px) * 1.6); aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line); }
.focus .scr.you { box-shadow: 0 0 0 1.5px var(--accent); } .focus .scr.wait { box-shadow: 0 0 0 1.5px var(--amber); }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4; display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 13px; color: #fff; font-size: 12px; background: rgba(15,15,15,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap; }
.hint .kbd { background: rgba(255,255,255,.12); color: rgba(255,255,255,.75); }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 12.5px; }
.status b { color: var(--fg-2); font-weight: 400; }
.screenbox { position: absolute; inset: 0; overflow: hidden; container-type: inline-size; }

/* painel de informações (⌘I) */
.info { position: absolute; top: 48px; right: 14px; z-index: 50; width: 260px; padding: 6px; border-radius: 12px; background: var(--pal); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 0 0 .5px rgba(0,0,0,.6), inset 0 0 0 1px var(--palline), 0 18px 50px rgba(0,0,0,.4); animation: pop .16s ease-out; }
.win.light .info { box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 18px 50px rgba(0,0,0,.15); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.info .r { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 30px; padding: 0 8px; font-size: 12.5px; }
.info .r span:first-child { color: var(--fg-2); }
.info .bar { width: 90px; height: 3px; border-radius: 2px; background: var(--line-2); overflow: hidden; margin-left: auto; }
.info .bar i { display: block; height: 100%; background: var(--fg); }
.info .v { min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.info hr { border: 0; height: 1px; background: var(--palline); margin: 4px 8px; }
.info .m { font: 11.5px var(--mono); }

/* ------------------------------------------------------------ ⌘K */
.k { position: absolute; inset: 0; z-index: 80; display: grid; justify-items: center; padding-top: 150px; background: rgba(0,0,0,.25); }
.win.light .k { background: rgba(0,0,0,.08); }
.k .box { width: 600px; height: max-content; border-radius: 14px; background: var(--pal); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 0 0 .5px rgba(0,0,0,.8), inset 0 0 0 1px var(--palline), 0 30px 80px rgba(0,0,0,.55); overflow: hidden; animation: pop .14s ease-out; }
.win.light .k .box { box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 30px 80px rgba(0,0,0,.2); }
.k .q { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 18px; border-bottom: 1px solid var(--palline); }
.k .q svg { color: var(--fg-3); } .k .q .t { flex: 1; } .k .q i { font-style: normal; color: var(--fg-3); }
.k .q .crumb { font-size: 12.5px; padding: 3px 8px; border-radius: 6px; background: var(--hover); color: var(--fg-2); }
.k .caret { display: inline-block; width: 1.5px; height: 20px; background: var(--accent); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.k .gr { padding: 6px; }
.k .gr small { display: block; padding: 6px 10px 3px; font-size: 11.5px; font-weight: 600; color: var(--fg-3); }
.k .o { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; }
.k .o svg { color: var(--fg-2); }
.k .o .g { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k .o .g em { font-style: normal; color: var(--fg-3); margin-left: 8px; font-size: 12.5px; }
.k .o .mt { width: 30px; height: 19px; border-radius: 3px; overflow: hidden; position: relative; background: #000; box-shadow: 0 0 0 .5px var(--line-2); }
.k .o.hl { background: var(--accent); color: #fff; }
.k .o.hl svg, .k .o.hl em { color: rgba(255,255,255,.8); }
.k .o.hl .kbd { background: rgba(255,255,255,.2); color: #fff; }
.k .foot { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 14px; border-top: 1px solid var(--palline); color: var(--fg-3); font-size: 11.5px; }
.k .foot span { display: inline-flex; align-items: center; gap: 5px; }
.k .foot .grow { flex: 1; }
.k .opts { display: flex; gap: 6px; padding: 4px 16px 12px; }
.k .chip { height: 24px; padding: 0 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg-2); background: var(--hover); }
.k .chip b { color: var(--fg); font-weight: 500; }

/* vazio */
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding-bottom: 44px; }
.empty h2 { font-size: 15px; font-weight: 600; }
.empty p { color: var(--fg-2); margin: 6px 0 16px; display: inline-flex; align-items: center; gap: 5px; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 12px; border-radius: 17px; background: var(--pal); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 0 .5px rgba(0,0,0,.6), inset 0 0 0 1px var(--palline), 0 12px 30px rgba(0,0,0,.35); font-size: 12.5px; white-space: nowrap; }
.toast .spin { margin: 0; width: 12px; height: 12px; }

/* ------------------------------------------------------------ tela falsa da VM */
.vmd { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; transform: scale(calc(100cqw / 1280px)); font-family: Arial, Helvetica, sans-serif; color: #1f1f1f; }
.vmd .wall { position: absolute; inset: 0; background: #1b1b1d; }
.vmd .dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 16px; border-radius: 22px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
.vmd .dock i { width: 52px; height: 52px; border-radius: 13px; display: block; }
.vmd .dock .chr { border-radius: 50%; background: conic-gradient(from -30deg, #ea4335 0 33%, #34a853 0 66%, #fbbc05 0); position: relative; }
.vmd .dock .chr::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: #4285f4; border: 4px solid #fff; }
.vmd .dock .trm { background: #26262a; border: 2px solid #8a8a8e; } .vmd .dock .fls { background: linear-gradient(#e9e9ec, #c7c7cc); }
.vmd .chrome { position: absolute; left: 0; top: 0; right: 0; bottom: 96px; background: #fff; display: flex; flex-direction: column; }
.vmd .tabsbar { height: 40px; background: #e3e7ee; display: flex; align-items: flex-end; padding: 0 10px; gap: 4px; }
.vmd .ctab { height: 32px; padding: 0 14px; border-radius: 10px 10px 0 0; background: #fff; display: flex; align-items: center; gap: 9px; font-size: 13px; width: 250px; white-space: nowrap; overflow: hidden; }
.vmd .ctab.off { background: transparent; color: #555; }
.vmd .fav { width: 16px; height: 16px; border-radius: 4px; background: #ff0033; flex: none; }
.vmd .omni { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #e3e3e3; }
.vmd .omni .u { flex: 1; height: 32px; border-radius: 16px; background: #eef0f3; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #333; }
.vmd .pg { flex: 1; position: relative; background: #f9f9f9; overflow: hidden; }
.vmd .ytbar { height: 56px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 22px; gap: 12px; font-weight: 600; font-size: 18px; }
.vmd .ytbar .logo { width: 30px; height: 21px; border-radius: 6px; background: #ff0033; position: relative; }
.vmd .ytbar .logo::after { content: ""; position: absolute; left: 12px; top: 6px; border: 5px solid transparent; border-left: 8px solid #fff; }
.vmd .modal2 { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 860px; height: 470px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; }
.vmd .modal2 h3 { font-size: 20px; padding: 20px 26px; border-bottom: 1px solid #e5e5e5; font-weight: 600; }
.vmd .mbody { flex: 1; display: grid; grid-template-columns: 1fr 300px; gap: 26px; padding: 22px 26px; }
.vmd .fld { border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; }
.vmd .fld small { display: block; color: #666; font-size: 12px; margin-bottom: 3px; }
.vmd .fld.big { height: 120px; }
.vmd .thumb { height: 170px; border-radius: 8px; background: #3a3f47; }
.vmd .mfoot { height: 64px; border-top: 1px solid #e5e5e5; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 13px; color: #555; }
.vmd .prog { flex: 1; height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; } .vmd .prog i { display: block; width: 64%; height: 100%; background: #065fd4; }
.vmd .next { background: #065fd4; color: #fff; padding: 9px 18px; border-radius: 18px; font-weight: 600; }
.vmd .captcha { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 420px; background: #fff; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.25); padding: 0 8px 8px; }
.vmd .captcha .cb { margin: 0 -8px; padding: 14px 20px; background: #4a90e2; color: #fff; font-size: 14px; } .vmd .captcha .cb b { display: block; font-size: 22px; }
.vmd .captcha .g9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.vmd .captcha .g9 i { height: 100px; background: #8a8f78; } .vmd .captcha .g9 i:nth-child(2n) { background: #6f7c8c; }
.vmd .captcha .cf { display: flex; justify-content: flex-end; } .vmd .captcha .cf span { background: #4a90e2; color: #fff; padding: 8px 18px; border-radius: 2px; font-weight: 600; font-size: 13px; }
.vmd .cur { position: absolute; z-index: 5; }
.vmd .cur span { position: absolute; left: 22px; top: 22px; white-space: nowrap; padding: 3px 9px; border-radius: 6px; color: #fff; font: 600 14px/1.4 var(--sys); }
.vmd .cur .ring { position: absolute; left: 6px; top: 6px; border-radius: 50%; border: 2px solid; transform: translate(-50%, -50%); animation: rip 1.6s ease-out infinite; }
@keyframes rip { from { opacity: .8; width: 12px; height: 12px; } to { opacity: 0; width: 64px; height: 64px; } }
.vmd .serp { padding: 28px 60px; }
.vmd .serp .q { width: 620px; height: 44px; border-radius: 22px; border: 1px solid #dfe1e5; box-shadow: 0 1px 6px rgba(32,33,36,.2); display: flex; align-items: center; padding: 0 20px; font-size: 16px; margin-bottom: 26px; }
.vmd .serp .r { width: 640px; margin-bottom: 22px; } .vmd .serp .r small { color: #4d5156; font-size: 13px; }
.vmd .serp .r b { display: block; color: #1a0dab; font-size: 19px; font-weight: 400; margin: 3px 0; } .vmd .serp .r p { color: #4d5156; font-size: 14px; line-height: 1.5; }
.vmd.tm { background: #0a0a0a; color: #d4d4d4; font: 18px/1.65 ui-monospace, Menlo, monospace; padding: 26px 32px; }
.vmd.tm .g { color: #ededed; font-weight: 600; } .vmd.tm .d { color: #737373; } .vmd.tm .ok { color: #62c073; }
.dim .vmd { filter: grayscale(1) brightness(.4); }
</style>
</head>
<body>
<div class="page">
  <header class="pagebar">
    <div class="brand">HyzeVM <span>· grade + foco + ⌘K</span></div>
    <div class="states" id="states"></div>
    <div class="grow"></div>
    <button class="themebtn" id="theme"></button>
  </header>
  <div class="stagewrap" id="wrap"><div class="scaler" id="scaler"></div></div>
</div>
<script>
"use strict";
/* ============================================================ dados */
const MACHINES = [
  { id: "agente-videos", tpl: "desktop", state: "running", always: true, screen: "yt", cpu: 38, mem: 41, disk: 15, memT: "1,6 GB", diskT: "4,6 GB", up: "3 h 12 min", task: "publicando um vídeo" },
  { id: "agente-pesquisa", tpl: "desktop", state: "running", always: false, screen: "serp", cpu: 12, mem: 28, disk: 9, memT: "1,1 GB", diskT: "2,8 GB", up: "48 min", task: "pesquisando tendências" },
  { id: "build-ci", tpl: "base", state: "running", always: false, screen: "term", cpu: 64, mem: 52, disk: 22, memT: "2,0 GB", diskT: "6,9 GB", up: "1 h 05 min", task: "rodando os testes" },
  { id: "edicao", tpl: "desktop", state: "paused", always: false, screen: "yt", cpu: 0, mem: 0, disk: 31, memT: "—", diskT: "9,6 GB", up: "—", task: "pausada há 2 h" },
];
const TPL = { minimal: "Terminal", base: "Desenvolvimento", desktop: "Com tela" };

/* ============================================================ ícones */
const P = {
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>',
  term: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', back: '<path d="M14 6l-6 6 6 6"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  pause: '<path d="M9 6v12M15 6v12"/>', play: '<path d="M8 5.5v13l10.5-6.5L8 5.5z"/>', power: '<path d="M12 3v8M6.4 6.6a8 8 0 1 0 11.2 0"/>',
  camera: '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.2-1.6h5.6L16 6h1.5A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8z"/><circle cx="12" cy="12.4" r="3.4"/>',
  hand: '<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.9-2.6L3.8 14a1.5 1.5 0 0 1 2.4-1.8L8 14"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/>', search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>',
  keys: '<rect x="2.8" y="6" width="18.4" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7 14h10"/>', trash: '<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>',
};
const ic = (n, s = 16, w = 1.6) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ============================================================ tela falsa */
function vm(m, { cur = null, captcha = false } = {}) {
  if (m.screen === "term") return `<div class="vmd tm"><div><span class="g">agent@${m.id}</span>:~/app$ docker compose up -d</div><div class="ok">✔ Container app-db-1  Started</div><div class="ok">✔ Container app-api-1 Started</div><div><span class="g">agent@${m.id}</span>:~/app$ npm test</div><div class="d">PASS src/api.test.ts (2,1 s)</div><div class="d">PASS src/worker.test.ts (1,4 s)</div><div>Tests: <span class="ok">128 passed</span>, 128 total</div><div><span class="g">agent@${m.id}</span>:~/app$ ▍</div></div>`;
  const dock = `<div class="dock"><i class="chr"></i><i class="trm"></i><i class="fls"></i></div>`;
  const c = cur ? `<div class="cur" style="left:${cur.x}px;top:${cur.y}px"><div class="ring" style="border-color:${cur.c}"></div><svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.6L10 19 5 3z" fill="${cur.c}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span style="background:${cur.c}">${cur.label}</span></div>` : "";
  if (m.screen === "serp") return `<div class="vmd"><div class="wall"></div><div class="chrome">
    <div class="tabsbar"><div class="ctab"><span class="fav" style="background:#4285f4"></span>tendências edição de vídeo</div><div class="ctab off">Notion — Pauta</div></div>
    <div class="omni"><span style="color:#888">◀ ▶ ⟳</span><div class="u">google.com/search?q=tendências+edição+de+vídeo+2026</div></div>
    <div class="pg"><div class="serp"><div class="q">tendências edição de vídeo 2026</div>
      <div class="r"><small>blog.creatorlab.com › tendencias</small><b>As 9 tendências de edição que vão dominar 2026</b><p>Cortes rápidos com legendas dinâmicas, B-roll e formatos verticais longos lideram o crescimento…</p></div>
      <div class="r"><small>youtube.com › creators</small><b>O que mudou no algoritmo de Shorts</b><p>Retenção nos primeiros 3 segundos continua sendo o principal sinal. Veja os dados do último trimestre…</p></div>
      <div class="r"><small>reddit.com › r/VideoEditing</small><b>Qual workflow vocês usam pra publicar todo dia?</b><p>Automatizei render + upload e deixo o agente cuidar das miniaturas…</p></div></div>${c}</div></div>${dock}</div>`;
  const body = captcha
    ? `<div class="captcha"><div class="cb">Selecione todas as imagens com<b>semáforos</b></div><div class="g9">${"<i></i>".repeat(9)}</div><div class="cf"><span>VERIFICAR</span></div></div>`
    : `<div class="modal2"><h3>Como montei um computador só para o meu agente</h3><div class="mbody"><div>
        <div class="fld"><small>Título (obrigatório)</small>Como montei um computador só para o meu agente</div>
        <div class="fld big"><small>Descrição</small>Neste vídeo mostro o HyzeVM: uma máquina Linux leve que fica ligada 24 h…</div></div>
        <div><div class="thumb"></div><div style="font-size:13px;color:#555;margin-top:10px">video_final_v3.mp4</div></div></div>
        <div class="mfoot">Enviando 64%… <div class="prog"><i></i></div><span class="next">Próximo</span></div></div>`;
  return `<div class="vmd"><div class="wall"></div><div class="chrome">
    <div class="tabsbar"><div class="ctab ${captcha ? "off" : ""}"><span class="fav"></span>Enviar vídeos — YouTube Studio</div><div class="ctab ${captcha ? "" : "off"}"><span class="fav" style="background:#c13584"></span>Instagram — Entrar</div></div>
    <div class="omni"><span style="color:#888">◀ ▶ ⟳</span><div class="u">${captcha ? "instagram.com/accounts/login/challenge" : "studio.youtube.com/channel/UCx9…/videos/upload"}</div></div>
    <div class="pg">${captcha ? "" : '<div class="ytbar"><span class="logo"></span>Studio</div>'}${body}${c}</div></div>${dock}</div>`;
}
const sb = (m, o) => `<div class="screenbox">${vm(m, o)}</div>`;

/* ============================================================ estado */
const S = { theme: "dark", view: "grid", sel: "agente-videos", control: "agent", ask: false, info: false, k: null, empty: false, creating: false, hover: null };
const PRESETS = {
  grade: ["Grade", { view: "grid", ask: false, hover: "agente-pesquisa" }],
  ajuda: ["Precisa de você", { view: "grid", ask: true }],
  foco: ["Foco", { view: "focus", sel: "agente-videos", control: "agent", ask: false }],
  focoajuda: ["Foco · precisa de você", { view: "focus", sel: "agente-videos", control: "wait", ask: true }],
  voce: ["Você no controle", { view: "focus", sel: "agente-videos", control: "you", ask: false }],
  info: ["Informações ⌘I", { view: "focus", sel: "agente-videos", control: "agent", ask: false, info: true }],
  term: ["Foco · terminal", { view: "focus", sel: "build-ci", control: "agent", ask: false }],
  k: ["⌘K", { view: "grid", k: "main" }],
  knova: ["⌘K · nova máquina", { view: "grid", k: "new" }],
  criando: ["Criando", { view: "grid", creating: true }],
  vazio: ["Vazio", { empty: true }],
};
let preset = "grade";
const RESET = { info: false, k: null, empty: false, creating: false, hover: null, ask: false, control: "agent", view: "grid" };
const isV = (m) => m.id === "agente-videos";
const ctlOf = (m) => (m.state !== "running" ? "idle" : isV(m) ? S.control : "agent");

/* ============================================================ render */
function render() {
  const m = MACHINES.find((x) => x.id === S.sel);
  let h = `<div class="win ${S.theme === "light" ? "light" : ""}"><div class="lights"><i></i><i></i><i></i></div>`;
  if (S.empty) h += topGrid() + `<div class="empty"><div><h2>Nenhuma máquina ainda</h2><p>Aperte <span class="kbd">⌘</span><span class="kbd">K</span> e digite um nome.</p><br><button class="pill solid" data-act="k-new">${ic("plus", 13, 2)}Nova máquina</button></div></div>`;
  else if (S.view === "grid") h += topGrid() + grid();
  else h += topFocus(m) + focus(m);
  if (S.info && S.view === "focus") h += info(m);
  if (S.creating) h += `<div class="toast"><span class="spin"></span>Criando <b>agente-2</b> · subindo o sistema<span class="kbd" style="margin-left:4px">8 s</span><button class="ib" style="width:22px;height:22px">${ic("back", 12).replace('<path d="M14 6l-6 6 6 6"/>', '<path d="M7 7l10 10M17 7L7 17"/>')}</button></div>`;
  if (S.k) h += palette();
  document.getElementById("scaler").innerHTML = h + "</div>";
  fit();
}

function topGrid() {
  return `<div class="top"><button class="find" data-act="k">${ic("search", 13)}<span>Buscar ou executar</span><span class="kbd">⌘K</span></button><div class="grow"></div><button class="ib" title="Nova máquina  ⌘N" data-act="k-new">${ic("plus", 17)}</button></div>`;
}

function grid() {
  const tiles = MACHINES.map((x) => {
    const wait = S.ask && isV(x);
    const st = x.state !== "running" ? "" : wait ? "wait" : "running";
    return `<div role="button" tabindex="0" class="tile ${wait ? "wait" : ""} ${x.state === "paused" ? "paused" : ""} ${S.hover === x.id ? "hover" : ""}" data-open="${x.id}">
      <div class="scr ${x.state === "paused" ? "dim" : ""}">${sb(x, { captcha: wait })}${wait ? `<span class="flag">${ic("hand", 12, 2)}Precisa de você</span>` : ""}
        <div class="acts"><button title="Pausar">${ic(x.state === "running" ? "pause" : "play", 13, 2)}</button><button title="Abrir">${ic("expand", 13, 1.8)}</button></div></div>
      <div class="meta"><span class="dot ${st}"></span><b>${x.id}</b><span>${wait ? "CAPTCHA no login do Instagram" : x.task}</span></div></div>`;
  }).join("");
  const creating = S.creating ? `<div class="tile creating"><div class="scr"><div><div class="spin"></div>Criando agente-2</div></div><div class="meta"><span class="dot"></span><b>agente-2</b><span>subindo o sistema</span></div></div>` : "";
  return `<div class="gridwrap"><div class="grid">${tiles}${creating}</div></div>`;
}

function topFocus(m) {
  const ctl = ctlOf(m);
  const status = ctl === "you" ? `<span class="dot you"></span><b>você está no controle</b>` : ctl === "wait" ? `<span class="dot wait"></span><b>precisa de você · CAPTCHA</b>` : ctl === "idle" ? `<span class="dot"></span><b>pausada</b>` : `<span class="dot running"></span><b>agente ${m.task}</b>`;
  let right = "";
  if (m.state === "running" && m.tpl === "desktop") right = ctl === "you" ? `<button class="pill blue" data-act="give">Devolver ao agente</button>` : `<button class="pill ${ctl === "wait" ? "solid" : "soft"}" data-act="take">${ic("hand", 13)}Assumir</button>`;
  return `<div class="top"><button class="back" data-act="home">${ic("back", 15, 1.8)}<span class="crumbname">${m.id}</span></button><span class="status">${status}</span>
    <div class="grow"></div>${right}<button class="ib" title="Pausar">${ic("pause", 15, 1.9)}</button><button class="ib ${S.info ? "" : ""}" title="Informações  ⌘I" data-act="info">${ic("info", 16)}</button></div>`;
}

function focus(m) {
  const ctl = ctlOf(m);
  const cur = { agent: { x: 860, y: 452, c: "#1d1d1f", label: "Agente" }, you: { x: 640, y: 330, c: "#0a84ff", label: "Você" }, wait: { x: 650, y: 430, c: "#a86e0c", label: "Esperando você" } }[ctl] || null;
  const hint = ctl === "you" ? `<div class="hint">Teclado e mouse na máquina<span class="kbd">⌘⎋</span>devolve</div>` : "";
  return `<div class="focus"><div class="scr ${ctl === "you" ? "you" : ctl === "wait" ? "wait" : ""}">${sb(m, { cur: m.state === "running" ? cur : null, captcha: isV(m) && (ctl === "wait" || ctl === "you") })}${hint}</div></div>`;
}

function info(m) {
  const bar = (p) => `<span class="bar"><i style="width:${p}%"></i></span>`;
  return `<div class="info">
    <div class="r"><span>CPU</span>${bar(m.cpu)}<span class="v">${m.cpu}%</span></div>
    <div class="r"><span>Memória</span>${bar(m.mem)}<span class="v">${m.memT}</span></div>
    <div class="r"><span>Disco</span>${bar(m.disk)}<span class="v">${m.diskT}</span></div><hr>
    <div class="r"><span>Ligada há</span><span>${m.up}</span></div>
    <div class="r"><span>Ligada 24 h</span><i class="sw ${m.always ? "on" : ""}"></i></div>
    <div class="r"><span class="m">hyzevm ssh ${m.id}</span><button class="ib" style="width:22px;height:22px">${ic("copy", 13)}</button></div></div>`;
}

function palette() {
  const opt = (icn, t, sub, k, hl, thumb) => `<div class="o ${hl ? "hl" : ""}">${thumb ? `<span class="mt">${thumb}</span>` : ic(icn, 15)}<span class="g">${t}${sub ? `<em>${sub}</em>` : ""}</span>${k ? `<span class="kbd">${k}</span>` : ""}</div>`;
  if (S.k === "new") {
    return `<div class="k" data-act="kclose"><div class="box"><div class="q">${ic("plus", 18)}<span class="crumb">Nova máquina</span><span class="t">agente-2<span class="caret"></span></span></div>
      <div class="gr"><small>Modelo</small>${opt("monitor", "Com tela", "navegador e dock · ~20 s", "↵", true)}${opt("code", "Desenvolvimento", "Docker, Node, Python · ~20 s")}${opt("term", "Terminal", "Debian puro · ~10 s")}</div>
      <div class="opts"><span class="chip">Tamanho <b>Padrão</b></span><span class="chip">Disco <b>32 GB</b></span><span class="chip">Ligada 24 h <b>sim</b></span></div>
      <div class="foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> modelo</span><span><span class="kbd">⇥</span> opções</span><span class="grow"></span><span><span class="kbd">↵</span> criar</span><span><span class="kbd">esc</span> voltar</span></div></div></div>`;
  }
  return `<div class="k" data-act="kclose"><div class="box"><div class="q">${ic("search", 18)}<span class="t">assum<i>ir</i></span></div>
    <div class="gr"><small>Ações</small>${opt("hand", "Assumir agente-videos", "precisa de você", "↵", true)}${opt("pause", "Pausar agente-pesquisa")}${opt("camera", "Capturar a tela", "", "⌘⇧S")}${opt("plus", "Nova máquina", "", "⌘N")}
    <small>Máquinas</small>${MACHINES.slice(0, 3).map((x, i) => opt("", x.id, x.task, "⌘" + (i + 1), false, sb(x))).join("")}</div>
    <div class="foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> navegar</span><span class="grow"></span><span><span class="kbd">↵</span> executar</span><span><span class="kbd">esc</span> fechar</span></div></div></div>`;
}

/* ============================================================ página */
function fit() {
  const w = document.getElementById("wrap");
  const s = Math.min((w.clientWidth - 40) / 1280, (w.clientHeight - 40) / 800, 1.25);
  document.getElementById("scaler").style.transform = `translate(-50%, -50%) scale(${s})`;
}
function drawStates() {
  document.getElementById("states").innerHTML = Object.entries(PRESETS).map(([k, [l]]) => `<button class="${k === preset ? "on" : ""}" data-p="${k}">${l}</button>`).join("");
  document.getElementById("theme").textContent = S.theme === "dark" ? "Ver claro" : "Ver escuro";
}
function applyPreset(k) { preset = k; Object.assign(S, RESET, PRESETS[k][1]); drawStates(); render(); }
addEventListener("resize", fit);
document.getElementById("states").onclick = (e) => { const b = e.target.closest("[data-p]"); if (b) applyPreset(b.dataset.p); };
document.getElementById("theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; drawStates(); render(); };
document.getElementById("scaler").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-open]"); if (!t) return;
  const d = t.dataset;
  if (d.open) { S.sel = d.open; S.view = "focus"; S.control = S.ask && d.open === "agente-videos" ? "wait" : "agent"; S.hover = null; }
  switch (d.act) {
    case "home": S.view = "grid"; S.info = false; break;
    case "take": S.control = "you"; S.ask = false; break;
    case "give": S.control = "agent"; break;
    case "info": S.info = !S.info; break;
    case "k": S.k = "main"; break;
    case "k-new": S.k = "new"; S.empty = false; break;
    case "kclose": if (e.target === t) { if (S.k === "new") { S.creating = true; } S.k = null; } break;
  }
  render();
});
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.k = S.k ? null : "main"; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") { e.preventDefault(); S.info = !S.info; render(); }
  if (e.key === "Escape") { if (S.k) S.k = null; else if (S.view === "focus") S.view = "grid"; render(); }
});
drawStates(); render();
</script>
</body>
</html>
