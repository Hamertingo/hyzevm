<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyzeVM — Variações de design</title>
<style>
/* ============================================================ base da página */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI Variable Display", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; background: #0e0e10; color: #f5f5f7; overflow: hidden; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.page { height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.pagebar { min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 20px; padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,.07); background: #121214; }
.pagebar .brand { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.pagebar .brand span { color: #8e8e93; font-weight: 500; }
.picker { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(255,255,255,.06); }
.picker button { padding: 6px 14px; border-radius: 8px; color: #a1a1a6; font-weight: 550; white-space: nowrap; }
.picker button b { color: #636366; font-weight: 700; margin-right: 6px; }
.picker button.on { background: #2c2c2e; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.picker button.on b { color: #0a84ff; }
.pagebar .note { flex: 1; min-width: 0; color: #8e8e93; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.themebtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,.06); color: #d1d1d6; font-weight: 550; white-space: nowrap; }
.stagewrap { position: relative; overflow: hidden; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% 0%, #1b1b20, #0e0e10); }
.scaler { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform-origin: center center; transform: translate(-50%, -50%); }

/* ============================================================ janela (mock macOS) */
.win { position: relative; width: 1280px; height: 800px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset, 0 30px 90px rgba(0,0,0,.55); font-size: 13px; }
.lights { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 30; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

/* tokens por tema (todas as variações usam) */
.win.light { --bg: #ffffff; --bg2: #f5f5f7; --bg3: #ebebef; --side: #f3f3f6; --text: #1d1d1f; --text2: #6e6e73; --text3: #a1a1a6; --line: rgba(0,0,0,.08); --fill: rgba(0,0,0,.045); --fill2: rgba(0,0,0,.08); --accent: #007aff; --accentSoft: rgba(0,122,255,.11); --card: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07); color: var(--text); background: var(--bg); }
.win.dark { --bg: #1c1c1e; --bg2: #232325; --bg3: #2c2c2e; --side: #202022; --text: #f5f5f7; --text2: #a1a1a6; --text3: #6e6e73; --line: rgba(255,255,255,.08); --fill: rgba(255,255,255,.055); --fill2: rgba(255,255,255,.1); --accent: #0a84ff; --accentSoft: rgba(10,132,255,.2); --card: #232325; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); color: var(--text); background: var(--bg); }
.win { --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2; }

/* componentes compartilhados */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex: none; display: inline-block; }
.dot.running { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.dot.paused { background: var(--orange); }
.dot.alert { background: var(--orange); animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--orange) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 8px; font-weight: 550; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 1px rgba(0,0,0,.04); white-space: nowrap; }
.win.dark .btn { background: var(--bg3); border-color: transparent; box-shadow: none; }
.btn:hover { filter: brightness(.97); }
.win.dark .btn:hover { filter: brightness(1.15); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text2); }
.btn.ghost:hover { background: var(--fill); filter: none; }
.ibtn { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--text2); }
.ibtn:hover { background: var(--fill); color: var(--text); }
.kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; font: 600 10.5px var(--font); color: var(--text2); background: var(--fill); border: 1px solid var(--line); }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill2); }
.seg button { height: 26px; padding: 0 15px; border-radius: 7px; font-weight: 550; color: var(--text2); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.win.dark .seg button.on { background: #5a5a5e; color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--fill); color: var(--text2); white-space: nowrap; }
.tag.green { background: color-mix(in srgb, var(--green) 16%, transparent); color: color-mix(in srgb, var(--green) 80%, var(--text)); }
.tag.orange { background: color-mix(in srgb, var(--orange) 18%, transparent); color: color-mix(in srgb, var(--orange) 85%, var(--text)); }
.tag.blue { background: var(--accentSoft); color: var(--accent); }
.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--fill2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s; }
.switch.on { background: var(--green); } .switch.on::after { transform: translateX(16px); }
.bar { height: 5px; border-radius: 3px; background: var(--fill2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.bar i.warn { background: var(--orange); }

/* ============================================================ desktop falso (a tela da VM) */
.screenbox { position: relative; overflow: hidden; background: #000; container-type: inline-size; }
.vmd { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; transform: scale(calc(100cqw / 1280px)); font-family: "Inter", system-ui, sans-serif; color: #1f1f1f; }
@supports not (transform: scale(calc(100cqw / 1280px))) { .vmd { transform: scale(var(--s, .5)); } }
.vmd .wall { position: absolute; inset: 0; background: linear-gradient(#16213e, #533a7b); }
.vmd .dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 16px; border-radius: 22px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); }
.vmd .dock i { width: 52px; height: 52px; border-radius: 13px; display: block; }
.vmd .dock .chr { border-radius: 50%; background: conic-gradient(from -30deg, #ea4335 0 33%, #34a853 0 66%, #fbbc05 0); position: relative; }
.vmd .dock .chr::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: #4285f4; border: 4px solid #fff; }
.vmd .dock .trm { background: #26262a; border: 2px solid #8a8a8e; }
.vmd .dock .fls { background: linear-gradient(#e9e9ec, #c7c7cc); }
.vmd .chrome { position: absolute; left: 0; top: 0; right: 0; bottom: 96px; background: #fff; display: flex; flex-direction: column; }
.vmd .tabsbar { height: 40px; background: #dfe7f6; display: flex; align-items: flex-end; padding: 0 10px; gap: 4px; }
.vmd .ctab { height: 32px; padding: 0 14px; border-radius: 10px 10px 0 0; background: #fff; display: flex; align-items: center; gap: 9px; font-size: 13px; width: 240px; }
.vmd .ctab.off { background: transparent; color: #555; }
.vmd .fav { width: 16px; height: 16px; border-radius: 4px; background: #ff0033; }
.vmd .omni { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #e3e3e3; }
.vmd .omni .u { flex: 1; height: 32px; border-radius: 16px; background: #eef1f7; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #333; }
.vmd .pg { flex: 1; position: relative; background: #f9f9f9; overflow: hidden; }
.vmd .ytbar { height: 56px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 22px; gap: 12px; font-weight: 600; font-size: 18px; }
.vmd .ytbar .logo { width: 30px; height: 21px; border-radius: 6px; background: #ff0033; position: relative; }
.vmd .ytbar .logo::after { content: ""; position: absolute; left: 12px; top: 6px; border: 5px solid transparent; border-left: 8px solid #fff; }
.vmd .modal { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 860px; height: 470px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; }
.vmd .modal h3 { font-size: 20px; padding: 20px 26px; border-bottom: 1px solid #e5e5e5; font-weight: 600; }
.vmd .mbody { flex: 1; display: grid; grid-template-columns: 1fr 300px; gap: 26px; padding: 22px 26px; }
.vmd .fld { border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; }
.vmd .fld small { display: block; color: #666; font-size: 12px; margin-bottom: 3px; }
.vmd .fld.big { height: 120px; }
.vmd .thumb { height: 170px; border-radius: 8px; background: linear-gradient(135deg, #2b2d42, #8d99ae); }
.vmd .mfoot { height: 64px; border-top: 1px solid #e5e5e5; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 13px; color: #555; }
.vmd .prog { flex: 1; height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; }
.vmd .prog i { display: block; width: 64%; height: 100%; background: #065fd4; }
.vmd .next { background: #065fd4; color: #fff; padding: 9px 18px; border-radius: 18px; font-weight: 600; }
.vmd .agentcur { position: absolute; z-index: 5; pointer-events: none; }
.vmd .agentcur svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
.vmd .agentcur span { position: absolute; left: 20px; top: 20px; white-space: nowrap; padding: 4px 10px; border-radius: 10px; background: #bf5af2; color: #fff; font: 600 13px system-ui; }
.vmd .ripple { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #bf5af2; transform: translate(-50%, -50%); animation: rip 1.8s ease-out infinite; }
@keyframes rip { from { opacity: .9; width: 14px; height: 14px; } to { opacity: 0; width: 70px; height: 70px; } }
.vmd .serp { padding: 28px 60px; }
.vmd .serp .q { width: 620px; height: 44px; border-radius: 22px; border: 1px solid #dfe1e5; box-shadow: 0 1px 6px rgba(32,33,36,.2); display: flex; align-items: center; padding: 0 20px; font-size: 16px; margin-bottom: 26px; }
.vmd .serp .r { width: 640px; margin-bottom: 22px; }
.vmd .serp .r small { color: #4d5156; font-size: 13px; }
.vmd .serp .r b { display: block; color: #1a0dab; font-size: 19px; font-weight: 500; margin: 3px 0; }
.vmd .serp .r p { color: #4d5156; font-size: 14px; line-height: 1.5; }
.vmd.term { background: #0d0f12; color: #c9d1d9; font: 17px/1.6 ui-monospace, Menlo, monospace; padding: 26px 32px; }
.vmd.term .p { color: #7ee787; } .vmd.term .d { color: #6e7681; }
.vmd.paused { filter: grayscale(1) brightness(.55); }

/* ============================================================ A · Clássico macOS */
.va { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
.va .side { background: var(--side); border-right: 1px solid var(--line); padding: 52px 10px 12px; display: flex; flex-direction: column; }
.win.light .va .side { background: rgba(236,236,241,.92); }
.va .sh { font-size: 11px; font-weight: 650; color: var(--text3); letter-spacing: .03em; text-transform: uppercase; padding: 10px 10px 6px; }
.va .it { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 9px; border-radius: 9px; width: 100%; text-align: left; }
.va .it:hover { background: var(--fill); }
.va .it.sel { background: var(--accentSoft); }
.va .tile { position: relative; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--fill2); color: var(--text2); flex: none; }
.va .it.sel .tile { background: var(--accent); color: #fff; }
.va .tile .dot { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--side); }
.va .nm { font-weight: 600; } .va .ss { font-size: 11.5px; color: var(--text2); }
.va .main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.va .tool { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--line); }
.va .tool h1 { font: 650 15px var(--display); }
.va .tool .grow { flex: 1; }
.va .body { flex: 1; min-height: 0; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.va .notice { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 11px; background: color-mix(in srgb, var(--orange) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--orange) 34%, transparent); }
.va .notice .g { flex: 1; } .va .notice b { font-weight: 650; } .va .notice small { display: block; color: var(--text2); }
.va .scr { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
.va .frame { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow), 0 0 0 1px var(--line); align-self: start; aspect-ratio: 16/10; }
.va .rail { display: flex; flex-direction: column; gap: 12px; }
.va .box { border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); padding: 14px; }
.va .box h4 { font-size: 11.5px; font-weight: 650; color: var(--text2); margin-bottom: 10px; }
.va .kv { display: flex; justify-content: space-between; padding: 5px 0; } .va .kv span:last-child { color: var(--text2); }
.va .mrow { display: grid; grid-template-columns: 70px 1fr 38px; align-items: center; gap: 10px; padding: 5px 0; }
.va .mrow span:last-child { text-align: right; color: var(--text2); }
.va .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.va .card { border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
.va .card h4 { padding: 12px 14px; font-weight: 650; }
.va .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); }
.va .row .v { color: var(--text2); }
.va .cons { flex: 1; border-radius: 12px; background: #0d0f12; color: #c9d1d9; font: 12.5px/1.65 var(--mono); padding: 14px 16px; }

/* ============================================================ B · Comando (denso, teclado) */
.vb { display: grid; grid-template-columns: 56px 300px 1fr; height: 100%; font-size: 12.5px; }
.vb .rail { background: var(--side); border-right: 1px solid var(--line); padding: 52px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vb .rail .ibtn.on { background: var(--fill2); color: var(--text); }
.vb .rail .sp { flex: 1; }
.vb .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.vb .lh { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.vb .lh b { font-weight: 650; font-size: 13px; }
.vb .search { margin: 10px 12px 6px; height: 30px; border-radius: 8px; background: var(--fill); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text3); }
.vb .search span { flex: 1; }
.vb .grp { padding: 10px 16px 4px; font-size: 11px; font-weight: 650; color: var(--text3); }
.vb .li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px 9px 16px; margin: 0 6px; border-radius: 8px; text-align: left; }
.vb .li:hover { background: var(--fill); }
.vb .li.sel { background: var(--fill2); }
.vb .li .n { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.vb .li .s { grid-column: 1; color: var(--text3); font-size: 11.5px; padding-left: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vb .li svg.spark { grid-row: 1 / span 2; align-self: center; }
.vb .detail { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.vb .dh { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--line); }
.vb .dh h2 { font: 650 14px var(--display); }
.vb .dh .grow { flex: 1; }
.vb .tabs { display: flex; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.vb .tabs button { padding: 10px 0; color: var(--text3); font-weight: 600; position: relative; }
.vb .tabs button.on { color: var(--text); }
.vb .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); border-radius: 2px; }
.vb .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 270px; }
.vb .stage { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); min-width: 0; }
.vb .frame { border-radius: 8px; overflow: hidden; aspect-ratio: 16/10; box-shadow: 0 0 0 1px var(--line); }
.vb .alert { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--orange) 40%, transparent); background: color-mix(in srgb, var(--orange) 9%, transparent); }
.vb .alert .g { flex: 1; color: var(--text2); } .vb .alert b { color: var(--text); }
.vb .insp { padding: 14px 16px; overflow: auto; }
.vb .insp h5 { font-size: 11px; font-weight: 650; color: var(--text3); margin: 14px 0 6px; }
.vb .insp h5:first-child { margin-top: 0; }
.vb .prop { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 4px 0; }
.vb .prop span:first-child { color: var(--text3); }
.vb .prop .m { font-family: var(--mono); font-size: 11.5px; }
.vb .feed { position: relative; padding-left: 14px; }
.vb .feed::before { content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.vb .ev { position: relative; padding: 4px 0 8px; }
.vb .ev::before { content: ""; position: absolute; left: -14px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--text3); box-shadow: 0 0 0 3px var(--bg); }
.vb .ev.k-takeover::before { background: var(--orange); } .vb .ev.k-browser::before { background: var(--accent); } .vb .ev.k-upload::before { background: var(--purple); } .vb .ev.k-exec::before { background: var(--green); }
.vb .ev small { display: block; color: var(--text3); font-size: 11px; }
.vb .statusbar { grid-column: 1 / -1; }
.vb-wrap { display: grid; grid-template-rows: 1fr 26px; height: 100%; }
.vb-sb { display: flex; align-items: center; gap: 18px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--side); color: var(--text3); font-size: 11.5px; }
.vb-sb .grow { flex: 1; }
.palette { position: absolute; inset: 0; z-index: 40; display: grid; justify-items: center; padding-top: 120px; background: rgba(0,0,0,.25); }
.palette .pbox { width: 600px; height: max-content; border-radius: 14px; background: var(--card); box-shadow: 0 30px 90px rgba(0,0,0,.45), 0 0 0 1px var(--line); overflow: hidden; }
.win.dark .palette .pbox { background: #262628; }
.palette .pin { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
.palette .pin span { flex: 1; color: var(--text); } .palette .pin span i { color: var(--text3); font-style: normal; }
.palette .pg { padding: 8px; }
.palette .pg small { display: block; padding: 6px 10px 4px; color: var(--text3); font-size: 11px; font-weight: 650; }
.palette .po { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; }
.palette .po.on { background: var(--accent); color: #fff; }
.palette .po.on .kbd { background: rgba(255,255,255,.2); color: #fff; border-color: transparent; }
.palette .po span { flex: 1; }

/* ============================================================ C · Palco (a tela em primeiro lugar) */
.vc { position: relative; height: 100%; background: #08080a; overflow: hidden; }

  b: { render: renderB, theme: "dark", note: "Comando: denso e rápido como Linear/Raycast. Lista com gráficos, inspetor à direita com a atividade do agente, ⌘K para tudo (clique na busca). Para quem usa muito." },
  c: { render: renderC, theme: "dark", note: "Palco: a tela da VM é a protagonista. Controles flutuantes de vidro, as máquinas numa faixa de miniaturas ao vivo embaixo e um inspetor que desliza (ícone de painel)." },
  d: { render: renderD, theme: "light", note: "Painel: cara de produto de startup. Grade de máquinas com miniaturas ao vivo; ao abrir, a tela fica ao lado da linha do tempo do agente. Criação por perguntas simples (clique em Nova máquina)." },
};
let cur = "abcd".includes(location.hash.slice(1, 2)) && location.hash.length > 1 ? location.hash[1] : "d";
if (location.hash.includes("pal")) B.palette = true;
if (location.hash.includes("insp")) C.insp = true;
if (location.hash.includes("open")) D.page = "machine";
if (location.hash.includes("new")) D.modal = true;
const themeOverride = {};
function render() {
  const v = VARIANTS[cur], theme = themeOverride[cur] || v.theme;
  document.querySelectorAll("#picker button").forEach((b) => b.classList.toggle("on", b.dataset.v === cur));
  document.getElementById("note").textContent = v.note;
  document.getElementById("theme").innerHTML = `${ic(theme === "dark" ? "sun" : "moon", 15)}${theme === "dark" ? "Ver claro" : "Ver escuro"}`;
  document.getElementById("scaler").innerHTML = `<div class="win ${theme}"><div class="lights"><i></i><i></i><i></i></div>${v.render()}</div>`;
  fit();
}
function fit() {
  const w = document.getElementById("wrap"), s = Math.min((w.clientWidth - 48) / 1280, (w.clientHeight - 40) / 800, 1.15);
  document.getElementById("scaler").style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit);
document.getElementById("picker").onclick = (e) => { const b = e.target.closest("button"); if (b) { cur = b.dataset.v; render(); } };
document.getElementById("theme").onclick = () => { const v = VARIANTS[cur]; themeOverride[cur] = (themeOverride[cur] || v.theme) === "dark" ? "light" : "dark"; render(); };
document.getElementById("scaler").addEventListener("click", (e) => {
  const t = e.target.closest("[data-a-sel],[data-a-tab],[data-b-sel],[data-b-tab],[data-b-pal],[data-b-pal-close],[data-c-sel],[data-c-insp],[data-d-open],[data-d-home],[data-d-new],[data-d-close],[data-d-close-btn],[data-d-filter]");
  if (!t) return;
  const d = t.dataset;
  if (d.aSel) A.sel = d.aSel; if (d.aTab) A.tab = d.aTab;
  if (d.bSel) B.sel = d.bSel; if (d.bTab) B.tab = d.bTab; if ("bPal" in d) B.palette = true; if ("bPalClose" in d && e.target === t) B.palette = false;
  if (d.cSel) C.sel = d.cSel; if ("cInsp" in d) C.insp = !C.insp;
  if (d.dOpen) { D.page = "machine"; D.sel = d.dOpen; } if ("dHome" in d) D.page = "home"; if ("dNew" in d) D.modal = true; if (d.dFilter) D.filter = d.dFilter;
  if (("dClose" in d && e.target === t) || "dCloseBtn" in d) D.modal = false;
  render();
});
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && cur === "b") { e.preventDefault(); B.palette = !B.palette; render(); }
  if (e.key === "Escape") { B.palette = false; D.modal = false; render(); }
  if (["1", "2", "3", "4"].includes(e.key) && !e.metaKey) { cur = "abcd"[+e.key - 1]; render(); }
});
render();
</script>
</body>
</html>
