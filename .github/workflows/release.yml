name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,       name: hyzevm-macos-arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,        name: hyzevm-macos-x64 }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   name: hyzevm-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  name: hyzevm-linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: hyzevm-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p hyzevm --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/hyzevm.exe dist/
            (cd dist && 7z a ../${{ matrix.name }}.zip hyzevm.exe >/dev/null)
          else
            cp target/${{ matrix.target }}/release/hyzevm dist/
            tar -C dist -czf ${{ matrix.name }}.tar.gz hyzevm
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}.*" }

  app-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/bundle-macos.sh
      - run: ditto -c -k --keepParent HyzeVM.app HyzeVM-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with: { name: HyzeVM-macos-arm64, path: HyzeVM-macos-arm64.zip }

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p hyzevm-app -p hyzevm
      - name: installer
        shell: bash
        run: |
          choco install nsis -y --no-progress >/dev/null || true
          mkdir dist-win
          cp target/release/hyzevm-app.exe dist-win/hyzevm-desktop.exe
          cp target/release/hyzevm.exe dist-win/hyzevm.exe
          V="${GITHUB_REF_NAME#v}"; [ "$V" = "$GITHUB_REF_NAME" ] && V=0.0.0
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$V" installer/windows.nsi
      - uses: actions/upload-artifact@v4
        with: { name: HyzeVM-windows-x64-setup, path: HyzeVM-windows-x64-setup.exe }

  app-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libssl-dev
      - name: build do app (deb + AppImage)
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd app && cargo tauri build --bundles deb,appimage --config '{"bundle":{"active":true,"targets":["deb","appimage"],"icon":["icons/icon.png"],"category":"DeveloperTool","shortDescription":"Uma máquina Linux própria para cada agente"}}'
      - name: empacota
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb out/HyzeVM-linux-x64.deb
          cp target/release/bundle/appimage/*.AppImage out/HyzeVM-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: HyzeVM-linux-x64, path: out/* }

  publish:
    needs: [build, app-macos, app-windows, app-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: sha256
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" \
            --title "HyzeVM ${{ github.ref_name }}" --prerelease --notes "First public alpha.

          **Verified:** macOS (Apple Silicon). Linux/Windows build in CI but have not been run end-to-end yet.

          Install: download the archive for your system, put \`hyzevm\` on your PATH, then \`brew install qemu\` (or your platform's QEMU) and run \`hyzevm doctor\`.
          The macOS app is \`HyzeVM-macos-arm64.zip\` (unzip, drag to Applications). Installed copies offer to update themselves.
          The Linux app is \`HyzeVM-linux-x64.AppImage\` (chmod +x and run) or the \`.deb\`. Linux is untested end-to-end.
          The Windows app is \`HyzeVM-windows-x64-setup.exe\` (double-click to install; it also bundles the \`hyzevm.exe\` CLI). Windows is untested end-to-end: install QEMU and enable Windows Hypervisor Platform first."
