name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,       name: hyzevm-macos-arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,        name: hyzevm-macos-x64 }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   name: hyzevm-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  name: hyzevm-linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: hyzevm-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p hyzevm --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/hyzevm.exe dist/
            (cd dist && 7z a ../${{ matrix.name }}.zip hyzevm.exe >/dev/null)
          else
            cp target/${{ matrix.target }}/release/hyzevm dist/
            tar -C dist -czf ${{ matrix.name }}.tar.gz hyzevm
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}.*" }

  app-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/bundle-macos.sh
      - run: ditto -c -k --keepParent HyzeVM.app HyzeVM-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with: { name: HyzeVM-macos-arm64, path: HyzeVM-macos-arm64.zip }

  publish:
    needs: [build, app-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: sha256
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" \
            --title "HyzeVM ${{ github.ref_name }}" --prerelease --notes "First public alpha.

          **Verified:** macOS (Apple Silicon). Linux/Windows build in CI but have not been run end-to-end yet.

          Install: download the archive for your system, put \`hyzevm\` on your PATH, then \`brew install qemu\` (or your platform's QEMU) and run \`hyzevm doctor\`.
          The macOS app is \`HyzeVM-macos-arm64.zip\` (unzip, drag to Applications). Installed copies offer to update themselves."
