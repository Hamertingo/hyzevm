name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,      name: hyzevm-macos-arm64 }
          - { os: macos-13,       target: x86_64-apple-darwin,       name: hyzevm-macos-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: hyzevm-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: hyzevm-linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: hyzevm-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p hyzevm --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/${{ matrix.target }}/release/hyzevm$ext "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}" }
