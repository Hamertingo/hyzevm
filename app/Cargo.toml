[package]
name = "hyzevm-app"
version = "0.1.2"
edition = "2021"
description = "HyzeVM desktop app"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hyzevm = { path = ".." }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
dirs = "5"
arboard = "3"

